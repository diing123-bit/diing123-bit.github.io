<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>세븐나이츠 리버스</title>
    <style>
        body {
            background-color: black;
            /* 화면 전체 높이를 100% 사용하도록 설정 */
            margin: 0;
            height: 100vh;
            
            /* 내부 요소를 정가운데 배치하는 마법의 코드 (Flexbox) */
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        img {
            /* 정중앙 위치에서 Y축(세로) 방향으로 -4cm (위로 4cm) 이동 */
            transform: translateY(-4cm);
            
            /* 이미지가 화면보다 클 경우를 대비해 최대 너비 제한 */
            max-width: 25%;
        }
    </style>
</head>
<body>
    <!-- src="여기" 에 방금 업로드한 이미지의 정확한 파일명을 적어주세요 -->
    <img src="GuildLogo.png" alt="세븐나이츠 리버스 로고">
</body>
</html>
