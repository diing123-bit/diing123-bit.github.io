<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>세븐나이츠 리버스</title>
    <style>
        body {
            background-color: black;
            margin: 0;
            height: 100vh;
            display: flex;
            
            /* 요소들을 가로가 아닌 세로(위아래)로 배치하도록 변경 */
            flex-direction: column; 
            justify-content: center;
            align-items: center;
        }
        
        img {
            transform: translateY(-7cm);
            max-width: 25%; /* 로고 크기 */
            margin-bottom: 60px; /* 로고와 아래 상자들 사이의 간격 */
        }

        /* 3개의 상자를 가로로 나란히 묶어주는 겉포장지 역할 */
        .box-container {
            display: flex;
            gap: 30px; /* 상자들 사이의 간격 */
        }

        /* 개별 상자의 디자인 */
        .box {
            width: 280px; /* 상자의 가로 너비 */
            height: 160px; /* 상자의 세로 높이 */
            background-color: white; /* 하얀색 바탕 */
            border: 4px solid black; /* 두께 4px의 검은색 테두리 */
            border-radius: 20px; /* 모서리를 둥글게 깎음 */
        }
    </style>
</head>
<body>
    <!-- 로고 이미지 (파일명 확인 필수) -->
    <img src="GuildLogo.png" alt="길드 로고">
    
    <!-- 하얀색 둥근 상자 3개 -->
    <div class="box-container">
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
    </div>
</body>
</html>
